# OpenTelemetry Collector -- the single endpoint Claude Code exports to.
#
# Claude Code emits three signals; Jaeger accepts exactly one of them. Without
# this fan-out, pointing Claude straight at Jaeger would leave its metrics and
# logs pipelines answering Unimplemented and two thirds of the telemetry would
# disappear without anyone being told. Every signal gets a real sink here.
#
# Ports come from lib/common.sh via ${env:...}; nothing is restated.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:${env:CT_OTLP_GRPC_PORT}
      http:
        endpoint: 127.0.0.1:${env:CT_OTLP_HTTP_PORT}

processors:
  # [LAW:single-enforcer] The one place the stack refuses to record itself.
  #
  # Jaeger v2 self-traces its own query API straight back into this collector,
  # and `ct verify` polls that API for up to 30s per sink check -- so every
  # verify run used to bury roughly a hundred `/api/traces` spans in the store
  # under ServiceName='jaeger', measured 2026-08-23 and again 2026-08-26. They
  # answer no question the epic asks (no span.type, so llm_requests never sees
  # them) and corrupt every question counted over claude.spans directly.
  #
  # This is where the rule is enforced because it is the only place all three
  # signals cross on the way to all four sinks. The switch that looks like it
  # should own this -- `service.telemetry.traces` in config/jaeger.yaml, or
  # OTEL_TRACES_EXPORTER=none in jaeger's process environment -- was tried both
  # ways and measured not to stop it. Enforcing per emitter is also N
  # checkpoints for one rule, and this stack has three daemons that could each
  # acquire self-telemetry in any release.
  #
  # Hence an allowlist rather than a drop-list of known offenders: the condition
  # states what the sinks are FOR, so an emitter nobody has thought of yet is
  # already excluded instead of pending a future edit. Failing closed is the
  # point -- a drop-list fails open exactly when a component starts emitting,
  # which is the day nobody is looking. [LAW:types-are-the-program]
  #
  # Not silent: `otelcol_processor_filter_datapoints_filtered` and its span and
  # log siblings count every drop on the telemetry port
  # (CT_COLLECTOR_TELEMETRY_PORT), so the rule reports what it is doing rather
  # than data merely going missing. [LAW:no-silent-failure]
  #
  # error_mode: propagate is deliberate. A span with no resource service.name
  # compares unequal to both names and is dropped, which is correct; what
  # propagate additionally buys is that an OTTL statement this file gets WRONG
  # in some future edit fails loudly at the processor instead of quietly
  # deciding every span's fate.
  filter/only_our_subjects:
    error_mode: propagate
    traces:
      span:
        - resource.attributes["service.name"] != "${env:CT_CLAUDE_SERVICE_NAME}" and resource.attributes["service.name"] != "${env:CT_SELFTEST_SERVICE}"
    metrics:
      datapoint:
        - resource.attributes["service.name"] != "${env:CT_CLAUDE_SERVICE_NAME}" and resource.attributes["service.name"] != "${env:CT_SELFTEST_SERVICE}"
    logs:
      log_record:
        - resource.attributes["service.name"] != "${env:CT_CLAUDE_SERVICE_NAME}" and resource.attributes["service.name"] != "${env:CT_SELFTEST_SERVICE}"

  # Small timeout: this is an interactive dev loop, so a span should be visible
  # in the UI a couple of seconds after the tool call finishes, not a minute.
  batch:
    timeout: 2s

exporters:
  otlp_grpc/jaeger:
    endpoint: 127.0.0.1:${env:CT_JAEGER_OTLP_PORT}
    tls:
      insecure: true

  # Two signals land here: a year of spans and a year of events, both answering
  # SQL. `otelcol-contrib components` reports this exporter Beta for traces and
  # Beta for logs -- check it there rather than here if it matters, since the
  # tier moves with the release. Badger stays the viewing sink of record anyway,
  # as the traces pipeline below shows, because it draws a trace and this cannot.
  #
  # create_schema is off because ClickHouse creates both tables itself at startup
  # (config/clickhouse.yaml), where the partitioning, sort key and one-year TTL
  # can be stated. Left on, this exporter would create them with its own defaults
  # -- daily partitions, and for logs no TTL whatsoever -- and every one of those
  # clauses is a migration afterwards.
  clickhouse:
    endpoint: tcp://127.0.0.1:${env:CT_CLICKHOUSE_NATIVE_PORT}?dial_timeout=10s
    database: ${env:CT_CLICKHOUSE_DATABASE}
    traces_table_name: ${env:CT_CLICKHOUSE_TABLE}
    logs_table_name: ${env:CT_CLICKHOUSE_EVENTS_TABLE}
    create_schema: false

  # Claude's counters (tokens, cost, tool decisions) as a scrape surface. Curl it
  # directly, or point a Prometheus at it later -- no extra process needed today.
  prometheus:
    endpoint: 127.0.0.1:${env:CT_CLAUDE_METRICS_PORT}
    resource_to_telemetry_conversion:
      enabled: true

extensions:
  health_check:
    endpoint: 127.0.0.1:${env:CT_COLLECTOR_HEALTH_PORT}

service:
  extensions: [health_check]
  pipelines:
    # One stream, two sinks, and they are independent: if ClickHouse is down the
    # collector retries into it while Jaeger keeps receiving, and the reverse.
    #
    # All three pipelines run the same processors in the same order, and the
    # filter comes first everywhere: what the stack refuses to record, it also
    # refuses to batch. Only the traces pipeline has ever leaked, but a rule
    # applied on the pipeline that happened to break is a rule the next
    # pipeline gets to break too. [LAW:dataflow-not-control-flow]
    traces:
      receivers: [otlp]
      processors: [filter/only_our_subjects, batch]
      exporters: [otlp_grpc/jaeger, clickhouse]
    metrics:
      receivers: [otlp]
      processors: [filter/only_our_subjects, batch]
      exporters: [prometheus]
    # Events go to the same store as the spans, and so inherit the same one-year
    # TTL rather than carrying a rotation count of their own. The file exporter
    # this replaced measured out to about two weeks before it dropped the oldest
    # data with no error and no log line; the arithmetic behind that lives once,
    # in the events table's comment in config/clickhouse.yaml.
    logs:
      receivers: [otlp]
      processors: [filter/only_our_subjects, batch]
      exporters: [clickhouse]
  telemetry:
    resource:
      attributes:
        - name: service.name
          value: claude-tracing-collector
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: ${env:CT_COLLECTOR_TELEMETRY_PORT}
    logs:
      level: info
