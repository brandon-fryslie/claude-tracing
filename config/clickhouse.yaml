# ClickHouse -- the year-long analytics sink, and the owner of the span table.
#
# Badger holds seven days and answers "show me this trace". This holds a year
# and answers "sum tokens by month". Neither is authoritative over the other:
# the collector's stream is the source of truth and fans out to both, so losing
# either sink leaves the other doing its own job unchanged.
#
# Ports and paths come from lib/common.sh through ClickHouse's `@from_env`
# substitution, so there is no second copy to drift. The one thing that cannot
# come from there is the schema below -- ClickHouse substitutes whole values,
# never substrings of a query -- so `claude.spans` is written here and read back
# by `ct` as the service's readiness question. If the two ever disagree, ClickHouse
# comes up, the readiness query 404s, and `./ct up` fails saying so. The
# agreement is checked on every start rather than trusted. [LAW:single-enforcer]

listen_host: 127.0.0.1
http_port:
  "@from_env": CT_CLICKHOUSE_HTTP_PORT
tcp_port:
  "@from_env": CT_CLICKHOUSE_NATIVE_PORT
path:
  "@from_env": CT_CLICKHOUSE_DATA_DIR

# Where `executable()` looks for the scripts it may run. Stated rather than left
# to ClickHouse's default of <path>/user_scripts, because `ct` writes the lit
# bridge into this directory and the two have to agree on where it is. Left
# implicit, the convention would be spelled once here and once in `ct`, and a
# server that looked somewhere `ct` never wrote is a ticket join that answers
# "no tickets" forever. Both read CT_CLICKHOUSE_SCRIPTS_DIR.
# [LAW:one-source-of-truth]
user_scripts_path:
  "@from_env": CT_CLICKHOUSE_SCRIPTS_DIR

# Logs go to stdout, which `ct` redirects into var/log/clickhouse.log alongside
# the other two services, so `./ct logs` shows all three. `warning` rather than
# `information` because ClickHouse narrates every background merge at info, and
# a log nobody can read is a log nobody checks. Errors still speak up.
logger:
  level: warning
  console: true

# A single-user analytics box on a laptop that is also running everything else.
# ClickHouse sizes its caches for a dedicated server by default -- 5 GB of mark
# cache alone -- which is the wrong trade here.
mark_cache_size: 268435456
max_server_memory_usage_to_ram_ratio: 0.3
max_concurrent_queries: 16

# No system.query_log and friends: they are the largest thing this server would
# write, and nothing in this stack reads them. Their absence is why `SHOW TABLES
# FROM system` is short.

profiles:
  default: {}
quotas:
  default: {}
users:
  default:
    password: ""
    profile: default
    quota: default
    # Loopback only, matching listen_host. Nothing here leaves the machine.
    networks:
      ip: "::1"

# --- the schema -------------------------------------------------------------
# Run by ClickHouse itself before it accepts connections, which is what keeps
# schema creation out of `ct`: there is no migration step to forget, no ordering
# to arrange, and the readiness probe cannot pass until this has run.
# [LAW:no-ambient-temporal-coupling]
#
# throw_on_error stops the server rather than logging past a broken DDL. A
# ClickHouse that is up but has no table to insert into is the worst outcome
# available: the collector would retry forever and the spans would be gone.
# [LAW:no-silent-failure]
startup_scripts:
  throw_on_error: true
  scripts:
    - query: CREATE DATABASE IF NOT EXISTS claude

    # Columns down to Links.Attributes are the OpenTelemetry ClickHouse
    # exporter's insert contract, copied from the schema it generates when left
    # to create its own table. We create it instead, because PARTITION BY, ORDER
    # BY and TTL cannot be changed after the fact and the exporter's defaults
    # (daily partitions, 30-day TTL, a sort key led by a column that only ever
    # holds "claude-code") are wrong for a year of analytics.
    #
    # That does make this a second copy of a list the exporter owns, so it is
    # held true the only way a copy can be: the exporter names its columns in
    # the INSERT, `ct verify` sends a span through it every run, and a version
    # that adds a column fails loudly there rather than quietly dropping data.
    - query: |
        CREATE TABLE IF NOT EXISTS claude.spans
        (
          Timestamp           DateTime64(9) CODEC(Delta(8), ZSTD(1)),
          TraceId             String CODEC(ZSTD(1)),
          SpanId              String CODEC(ZSTD(1)),
          ParentSpanId        String CODEC(ZSTD(1)),
          TraceState          String CODEC(ZSTD(1)),
          SpanName            LowCardinality(String) CODEC(ZSTD(1)),
          SpanKind            LowCardinality(String) CODEC(ZSTD(1)),
          ServiceName         LowCardinality(String) CODEC(ZSTD(1)),
          ResourceAttributes  Map(LowCardinality(String), String) CODEC(ZSTD(1)),
          ScopeName           String CODEC(ZSTD(1)),
          ScopeVersion        String CODEC(ZSTD(1)),
          SpanAttributes      Map(LowCardinality(String), String) CODEC(ZSTD(1)),
          Duration            UInt64 CODEC(ZSTD(1)),
          StatusCode          LowCardinality(String) CODEC(ZSTD(1)),
          StatusMessage       String CODEC(ZSTD(1)),
          `Events.Timestamp`  Array(DateTime64(9)) CODEC(ZSTD(1)),
          `Events.Name`       Array(LowCardinality(String)) CODEC(ZSTD(1)),
          `Events.Attributes` Array(Map(LowCardinality(String), String)) CODEC(ZSTD(1)),
          `Links.TraceId`     Array(String) CODEC(ZSTD(1)),
          `Links.SpanId`      Array(String) CODEC(ZSTD(1)),
          `Links.TraceState`  Array(String) CODEC(ZSTD(1)),
          `Links.Attributes`  Array(Map(LowCardinality(String), String)) CODEC(ZSTD(1)),

          -- Everything below is promoted out of the attribute maps: MATERIALIZED,
          -- so it is computed once at insert and stored as a real column that can
          -- lead the sort key and carry an index. The maps keep the originals, so
          -- promotion buys query ergonomics and index reach, never exclusivity --
          -- an attribute nobody promoted is still there in SpanAttributes.
          --
          -- What earns a column is being a grouping key for one of the questions
          -- this table exists to answer. Note that a key which is simply absent
          -- extracts to '', which costs nothing in a dictionary-encoded column.

          -- interaction | llm_request | tool | tool.execution | tool.blocked_on_user.
          -- Leads the sort key because essentially every analytical query starts by
          -- naming one of them.
          SpanType            LowCardinality(String) MATERIALIZED SpanAttributes['span.type'],
          SessionId           String MATERIALIZED SpanAttributes['session.id'],
          InteractionSequence UInt32 MATERIALIZED toUInt32OrZero(SpanAttributes['interaction.sequence']),

          -- Subagents, and the one thing to know about them: `agent_id` is stamped
          -- on the subagent's own llm_request spans, while `subagent_type` is
          -- stamped on the Agent *tool* span that spawned it. They never appear on
          -- the same row. Attributing tokens to a subagent TYPE is therefore a walk
          -- up the tree -- llm_request -> tool.execution -> tool -- and not a GROUP
          -- BY. `RequestContext` is the cheap way to avoid that walk when the type
          -- does not matter: it reads 'tool' on a subagent's requests and
          -- 'interaction' on the main agent's.
          --
          -- ParentAgentId is documented by Claude Code for nested agents and has
          -- not yet been observed in this stack's data; if the key is never sent,
          -- this column is uniformly empty. Promoted anyway because adding it later
          -- is a migration, and an unused empty column costs nothing.
          AgentId             String MATERIALIZED SpanAttributes['agent_id'],
          ParentAgentId       String MATERIALIZED SpanAttributes['parent_agent_id'],
          SubagentType        LowCardinality(String) MATERIALIZED SpanAttributes['subagent_type'],
          RequestContext      LowCardinality(String) MATERIALIZED SpanAttributes['llm_request.context'],

          Model               LowCardinality(String) MATERIALIZED SpanAttributes['model'],
          ToolName            LowCardinality(String) MATERIALIZED SpanAttributes['tool_name'],
          StopReason          LowCardinality(String) MATERIALIZED SpanAttributes['stop_reason'],

          InputTokens         UInt32 MATERIALIZED toUInt32OrZero(SpanAttributes['input_tokens']),
          OutputTokens        UInt32 MATERIALIZED toUInt32OrZero(SpanAttributes['output_tokens']),
          CacheReadTokens     UInt32 MATERIALIZED toUInt32OrZero(SpanAttributes['cache_read_tokens']),
          CacheCreationTokens UInt32 MATERIALIZED toUInt32OrZero(SpanAttributes['cache_creation_tokens']),

          -- Claude Code emits no context-size attribute, so this is the proxy:
          -- everything the model had to read on this request. MATERIALIZED rather
          -- than derived at query time, and that is the deliberate choice -- as a
          -- query-time expression the definition would be retyped in every query
          -- that touches the 400k question and would drift between them, which is
          -- how two answers to one question start disagreeing. Stored once, it is
          -- one definition and it can carry the skip index below.
          -- [LAW:one-source-of-truth]
          ContextTokens       UInt32 MATERIALIZED toUInt32OrZero(SpanAttributes['input_tokens'])
                                                + toUInt32OrZero(SpanAttributes['cache_read_tokens'])
                                                + toUInt32OrZero(SpanAttributes['cache_creation_tokens']),

          -- Stamped by `ct claude`, not by Claude Code, and they arrive as resource
          -- attributes rather than span attributes. Sessions started any other way
          -- have them empty, which reads as "launched outside the launcher".
          Repository          LowCardinality(String) MATERIALIZED ResourceAttributes['vcs.repository.name'],
          Branch              LowCardinality(String) MATERIALIZED ResourceAttributes['vcs.ref.head.name'],
          WorkingDirectory    String MATERIALIZED ResourceAttributes['process.working_directory'],

          INDEX idx_trace_id       TraceId                        TYPE bloom_filter(0.001) GRANULARITY 1,
          INDEX idx_res_attr_key   mapKeys(ResourceAttributes)    TYPE bloom_filter(0.01)  GRANULARITY 1,
          INDEX idx_res_attr_value mapValues(ResourceAttributes)  TYPE bloom_filter(0.01)  GRANULARITY 1,
          INDEX idx_span_attr_key  mapKeys(SpanAttributes)        TYPE bloom_filter(0.01)  GRANULARITY 1,
          INDEX idx_span_attr_val  mapValues(SpanAttributes)      TYPE bloom_filter(0.01)  GRANULARITY 1,
          INDEX idx_duration       Duration                       TYPE minmax GRANULARITY 1,
          INDEX idx_context_tokens ContextTokens                  TYPE minmax GRANULARITY 1
        )
        ENGINE = MergeTree

        -- Monthly, because a year is the retention target and the questions are
        -- monthly ones ("tokens spent on tool usage in march"). The exporter's
        -- own default is daily, which would leave 365 partitions standing in for
        -- 12 real answers.
        PARTITION BY toYYYYMM(Timestamp)

        -- SpanType first because every analytical query names one and it prunes
        -- hardest; SessionId next so "everything session X did" stays a seek
        -- rather than a scan; Timestamp last to order within. ServiceName leads
        -- the exporter's default sort key and is omitted here on purpose -- it
        -- holds one value, so as a leading key it sorts nothing.
        ORDER BY (SpanType, SessionId, Timestamp)

        -- A year, stated rather than inherited. With ttl_only_drop_parts a whole
        -- month is dropped at once, when its newest row passes a year old, so
        -- real retention runs 12-13 months. That is the deliberate trade: dropping
        -- by part is a file unlink, and the alternative is rewriting every part in
        -- the table to evict rows a day at a time.
        TTL toDateTime(Timestamp) + INTERVAL 1 YEAR
        SETTINGS ttl_only_drop_parts = 1

    # --- events ----------------------------------------------------------
    # The logs signal. Some of it restates what spans already carry -- the prompt
    # text is a `user_prompt` attribute on the interaction span, so read it there
    # -- and some of it has no span at all: api_error, api_retries_exhausted,
    # hook executions, plugin and MCP loads, skill activations, subagent
    # completions. That second list is why deleting this pipeline was the wrong
    # answer to the retention question below.
    #
    # THE CANONICAL RETENTION ARITHMETIC. Stated once, here, next to the table it
    # justifies; lib/common.sh, config/collector.yaml and the README point at
    # this block rather than restating it, because four copies of one derivation
    # are four chances to correct one and leave three lying.
    # [LAW:one-source-of-truth]
    #
    #   measured   4,798 records over 82.2 h = 9,100,461 bytes of OTLP JSON
    #              ~1.9 KB a record, ~12.8 KB per tool call
    #   scaled     41,341 tool calls a month (the epic's measured baseline)
    #              -> ~500 MB of JSON a month
    #   the file   max_megabytes 64, max_backups 3 -- the active file plus three
    #              backups, so 256 MB total, or ABOUT TWO WEEKS, after which the
    #              oldest went out with no error and no log line
    #   here       the same 4,798 records occupy 580 KiB on disk, a factor of 15,
    #              putting a year under 400 MB
    #
    # The factor of 15 is not luck: ~60% of every record is the same identity
    # block (user.email, user.id, organization.id) repeated verbatim, which is
    # nearly free once dictionary-encoded and is paid for in full in JSON.
    # Re-derive the last line with:
    #   SELECT formatReadableSize(sum(bytes_on_disk)), sum(rows)
    #   FROM system.parts WHERE database='claude' AND table='events' AND active
    #
    # Columns down to EventName are the exporter's logs INSERT contract, captured
    # by letting it create its own table and reading the result back, the same way
    # and for the same reason as the spans table above. The eight
    # __otel_materialized_k8s.* columns it also generates are omitted: they are
    # MATERIALIZED, so the exporter cannot name them in an INSERT, and none of
    # this runs in Kubernetes.
    - query: |
        CREATE TABLE IF NOT EXISTS claude.events
        (
          Timestamp          DateTime64(9) CODEC(Delta(8), ZSTD(1)),
          TraceId            String CODEC(ZSTD(1)),
          SpanId             String CODEC(ZSTD(1)),
          TraceFlags         UInt8,
          SeverityText       LowCardinality(String) CODEC(ZSTD(1)),
          SeverityNumber     UInt8,
          ServiceName        LowCardinality(String) CODEC(ZSTD(1)),
          Body               String CODEC(ZSTD(1)),
          ResourceSchemaUrl  LowCardinality(String) CODEC(ZSTD(1)),
          ResourceAttributes Map(LowCardinality(String), String) CODEC(ZSTD(1)),
          ScopeSchemaUrl     LowCardinality(String) CODEC(ZSTD(1)),
          ScopeName          String CODEC(ZSTD(1)),
          ScopeVersion       LowCardinality(String) CODEC(ZSTD(1)),
          ScopeAttributes    Map(LowCardinality(String), String) CODEC(ZSTD(1)),
          LogAttributes      Map(LowCardinality(String), String) CODEC(ZSTD(1)),

          -- OTLP's own field for this, and Claude Code leaves it empty on every
          -- record -- 2.1.226 puts the event name in Body instead. Kept because
          -- it is part of the INSERT contract above, not because it answers
          -- anything: query Body for the event name, never this.
          EventName          String CODEC(ZSTD(1)),

          -- Promoted out of the maps for the same reasons as on spans: computed
          -- once at insert, real columns that can lead the sort key, originals
          -- left in place. SessionId is the session-grain key -- the one every
          -- join in this file already uses to reach spans, session_turns and
          -- lit's ticket history.
          --
          -- It is NOT how you find the span an event fired inside: a session
          -- holds thousands of spans, so an equi-join on SessionId alone is a
          -- cross product. Use the SpanId column above for that -- it comes
          -- straight from OTLP and Claude Code populates it on the events that
          -- matter (tool_decision, tool_result, api_request: >99% non-empty on
          -- this machine's data), so `events.SpanId = spans.SpanId` is the
          -- per-event match and needs no time window.
          SessionId          String MATERIALIZED LogAttributes['session.id'],

          -- Stamped by `ct claude`, so sessions launched any other way have them
          -- empty -- the same reading as on spans.
          Repository         LowCardinality(String) MATERIALIZED ResourceAttributes['vcs.repository.name'],
          Branch             LowCardinality(String) MATERIALIZED ResourceAttributes['vcs.ref.head.name'],

          -- SpanId is the join key the comment above sends readers to, and it is
          -- in neither the sort key nor any map index, so it gets its own -- the
          -- same instrument and tolerance idx_trace_id uses on spans, for the
          -- same reason: a per-row identifier is what a bloom filter is for.
          --
          -- What it buys is the POINT LOOKUP -- `WHERE SpanId = '...'`, which is
          -- how you go from one span to the events inside it. It does not make
          -- an unfiltered year-wide `events JOIN spans ON SpanId` cheap: a hash
          -- join builds from one side and scans the other, and a skip index
          -- prunes granules only when a WHERE selects them. Narrow first, then
          -- join the remainder -- and note that each way of narrowing is pruned
          -- by a different thing: Body by the sort key, a time range by the
          -- monthly partitions, SessionId by its own index below.
          INDEX idx_span_id        SpanId                        TYPE bloom_filter(0.001) GRANULARITY 1,

          -- SessionId gets the same treatment, and it is not redundant with its
          -- place in the sort key. The key is (Body, SessionId, Timestamp), so
          -- rows are ordered by SessionId only WITHIN a Body group; a
          -- `WHERE SessionId = '...'` that names no Body finds the sparse
          -- primary index unable to prune, because a mark's SessionId range
          -- spans most of the id space once Body is unconstrained. Measured
          -- with EXPLAIN indexes = 1 -- the PrimaryKey condition engages and
          -- keeps 4/4 granules, while this index takes the same query to 1/3.
          -- "Everything session X logged" is the common interactive query, so
          -- it is worth an index rather than a caveat.
          INDEX idx_session_id     SessionId                     TYPE bloom_filter(0.001) GRANULARITY 1,

          INDEX idx_log_attr_key   mapKeys(LogAttributes)        TYPE bloom_filter(0.01) GRANULARITY 1,
          INDEX idx_log_attr_value mapValues(LogAttributes)      TYPE bloom_filter(0.01) GRANULARITY 1,
          INDEX idx_res_attr_key   mapKeys(ResourceAttributes)   TYPE bloom_filter(0.01) GRANULARITY 1,
          INDEX idx_res_attr_value mapValues(ResourceAttributes) TYPE bloom_filter(0.01) GRANULARITY 1
        )
        ENGINE = MergeTree

        -- Monthly, matching spans, and against the exporter's own default of
        -- daily -- which would stand up 365 partitions to answer twelve monthly
        -- questions, and would make the TTL below evict a day at a time.
        PARTITION BY toYYYYMM(Timestamp)

        -- Body first because it holds the event name and every query starts by
        -- naming one, exactly as SpanType leads the spans key. SessionId next so
        -- that once a Body is named, one session's rows are contiguous rather
        -- than scattered through the group -- which is what it buys, and all it
        -- buys: a SessionId filter that names no Body prunes nothing here, and
        -- is served by idx_session_id above instead. Timestamp last to order
        -- within. The exporter's default leads with toStartOfFiveMinutes(
        -- Timestamp) then ServiceName, and ServiceName holds one value here, so
        -- as a sort key it sorts nothing.
        ORDER BY (Body, SessionId, Timestamp)

        -- The same year the spans get, stated the same way. The exporter creates
        -- its logs table with no TTL at all, so inheriting its default would
        -- have traded a ceiling that drops data early for one that never drops
        -- it -- and left the two signals in one store disagreeing about how far
        -- back "all of it" reaches. [LAW:one-source-of-truth]
        TTL toDateTime(Timestamp) + INTERVAL 1 YEAR
        SETTINGS ttl_only_drop_parts = 1

    # --- prices ---------------------------------------------------------
    # No span carries a cost. Claude Code emits dollars only on the metrics
    # signal, at session grain and onto a Prometheus scrape surface that forgets
    # a series after metric_expiration -- so there is no per-request cost to
    # promote and no history to backfill from. Dollars are therefore DERIVED
    # here, from token counts this table already holds back to its first row.
    #
    # That direction is the deliberate one, and not only because it is the one
    # that works. Anthropic's counter is itself tokens multiplied by a rate
    # table; capturing it would store someone else's arithmetic with the rate
    # table thrown away -- unauditable, un-backfillable, and stuck at session
    # grain, where it could never be split by `ServesToolCall` or `SubagentType`.
    # Tokens are the territory and dollars are a map; this repo keeps the
    # territory and redraws the map on every read. [FRAMING:representation]
    #
    # A VIEW rather than a table, for the reason the views below are: it holds
    # no data, so this file stays authoritative over what the server has and a
    # price edit applies on the next `./ct up` everywhere, instead of applying
    # on a fresh checkout and being silently ignored on a machine that already
    # ran. A seeded table would be a second copy of these numbers.
    # [LAW:one-source-of-truth]
    #
    # EffectiveFrom is what keeps a price change from rewriting history. Prices
    # move; a table holding only today's rate would silently re-price last March
    # at this March's numbers and return something entirely plausible. So a rate
    # is not a fact about a model, it is a fact about a model over an interval,
    # and the join below is an ASOF join that asks for the rate in force at the
    # timestamp of the request. Adding a price is appending a row.
    # [LAW:types-are-the-program]
    #
    # THE DATE ON THESE ROWS IS THE DATE THEY WERE VERIFIED, not the date
    # Anthropic set the price -- which this repo has no way to know. A span older
    # than the earliest row here matches nothing and comes back `Priced = false`
    # rather than costed at a rate nobody checked against it. Unpriced and loud
    # beats plausible and wrong. [LAW:no-silent-failure]
    #
    # HOW THESE FOUR NUMBERS WERE ESTABLISHED, so the next person can redo it
    # rather than trust it: Claude Code's own `claude_code_cost_usage_USD_total`
    # counter is an independent computation of the same quantity, and it is
    # labelled identically to `claude_code_token_usage_tokens_total` apart from a
    # `type` label. Matching the two on every other label gives, per series, a
    # dollar figure and the four token counts behind it -- and the rates fall
    # out. Every observed series reproduced, to the limit of what the counter can
    # express: it is serialised as a float64, so it reports 2.6423449999999997
    # where the true figure is 2.642345, and the decimal computed here is the
    # more exact of the two. The procedure, and the trap that the counter is a
    # decaying window rather than a ledger, are in docs/analytics-findings.md.
    #
    # Model is matched exactly, suffix and all. `claude-opus-5[1m]` is a routing
    # identifier rather than a price tier -- measured, it bills at plain Opus 5
    # rates with no long-context premium -- but the next suffix might not, so an
    # unknown one must miss this table loudly instead of being normalised onto a
    # rate that was never checked against it. That exactness is why one model can
    # need two rows: the bare `claude-opus-5` row is the same measurement as the
    # `[1m]` row above it, written out again because an exact match cannot infer
    # one string from the other. `claude-haiku-4-5-20251001` was measured on
    # input and output only -- no Haiku request in this store has ever touched
    # the cache, so its two cache rates are the published multipliers carried
    # over from Opus and are the first thing to re-check if a Haiku figure ever
    # looks wrong.
    #
    # Cache creation is the one rate that is not a list price: it is the base
    # input rate times a multiplier set by the cache TTL the request asked for,
    # 2x at one hour and 1.25x at five minutes. No span records which TTL was
    # used, so this column cannot be derived per request -- it is a claim about
    # how the client is configured. The measured multiplier is 2x, Claude Code's
    # one-hour TTL, and re-running the procedure above is what catches it
    # changing.
    # The rates are written per MILLION tokens, the unit every price list quotes,
    # and the view also exposes each one per single token. That second set is not
    # a convenience: it is where the scale is chosen, and choosing it in the
    # wrong place silently truncates money.
    #
    # A rate carries 6 decimal places, so a rate divided by a million needs 12 to
    # stay exact. ClickHouse gives a decimal division the scale of its left
    # operand, which makes the order of operations load-bearing. Multiplying
    # first and dividing after -- `tokens * ratePerMTok / 1000000` -- divides a
    # scale-6 product and truncates the answer back to 6 places: a real
    # 0.2605975 stores as 0.260597, and one Haiku cache-read token, at
    # $0.0000001, stores as zero. Truncation, not rounding, so every request
    # under-reports and a month's total drifts one way only. Dividing the rate
    # first, at scale 12, keeps both exact.
    #
    # Decimal(18,12) tops out near $1,000,000, which no single request
    # approaches, and `sum()` promotes to Decimal(38,12), so totals have room
    # regardless. [LAW:one-source-of-truth] the conversion is stated once here
    # rather than at each of the four multiplications downstream, which is also
    # what keeps those four readable as plain tokens-times-rate.
    - query: |
        CREATE OR REPLACE VIEW claude.model_prices AS
        SELECT
          Model,
          EffectiveFrom,
          InputUSDPerMTok,
          CacheReadUSDPerMTok,
          CacheCreationUSDPerMTok,
          OutputUSDPerMTok,
          toDecimal64(InputUSDPerMTok, 12)         / 1000000 AS InputUSDPerToken,
          toDecimal64(CacheReadUSDPerMTok, 12)     / 1000000 AS CacheReadUSDPerToken,
          toDecimal64(CacheCreationUSDPerMTok, 12) / 1000000 AS CacheCreationUSDPerToken,
          toDecimal64(OutputUSDPerMTok, 12)        / 1000000 AS OutputUSDPerToken
        FROM values(
          'Model String,
           EffectiveFrom Date,
           InputUSDPerMTok Decimal64(6),
           CacheReadUSDPerMTok Decimal64(6),
           CacheCreationUSDPerMTok Decimal64(6),
           OutputUSDPerMTok Decimal64(6)',

          -- Model                       EffectiveFrom          Input  CacheRead  CacheCreation  Output
          ('claude-opus-5[1m]',          toDate('2026-08-23'),    5.0,       0.5,          10.0,   25.0),
          ('claude-opus-5',              toDate('2026-08-23'),    5.0,       0.5,          10.0,   25.0),
          ('claude-haiku-4-5-20251001',  toDate('2026-08-23'),    1.0,       0.1,           2.0,    5.0)
        )

    # The other thing the flat table cannot express: what a request had to do with
    # a tool call. Tokens are on llm_request spans, tools are on tool spans, and
    # they are siblings under an interaction -- so the link is not a join, it is
    # the ORDER of requests. A request that ends `stop_reason='tool_use'` is the
    # model deciding to call a tool; the request that comes NEXT under the same
    # parent is the one carrying that tool's output back into context. The second
    # is where the money is, because a tool returning 40 KB is paid for on the
    # next request rather than its own.
    #
    # That ordering is the whole difficulty, and it is stated once here for the
    # same reason the two-hop walk above is: re-derived per query it would
    # eventually be got wrong by one row and return a number that looks entirely
    # reasonable. Every question about tool cost reads this view.
    # [LAW:one-source-of-truth]
    #
    # THE DEFINITION, so that later questions inherit it rather than re-choosing:
    # a request SERVES a tool call when it decided to make one, carries one's
    # result, or ran inside one. The third clause is the subagents: a request with
    # `RequestContext='tool'` exists only because the Agent tool was called, so
    # its tokens are tool spend as squarely as the other two -- and leaving it out
    # silently drops an entire category, which at a 20:1 subagent-to-turn ratio is
    # most of the bill.
    #
    # `ServesToolCall` is a union over requests, not a sum over tool calls -- a
    # request meeting all three clauses is still one request, counted once, which
    # is what makes `sum(TotalTokens) WHERE ServesToolCall` an honest share of the
    # month rather than a figure that can exceed it. The clauses stay separately
    # visible (`EndedInToolCall`, `CarriesToolResult`, `RequestContext`) so the
    # union can always be taken apart again.
    #
    # `ToolResultTokens` is the sharper, smaller number underneath: how far the
    # context grew beyond what the model itself wrote, which is the tool's output
    # measured in tokens. It is left signed rather than clamped at zero -- across
    # every observed pair it is positive, so a negative one is real news (a
    # context rewritten between two requests) and clamping would bury it.
    # [LAW:no-silent-failure]
    #
    # One partition key covers all three request populations with no special
    # case: main-agent requests hang off their `interaction` span, a subagent's
    # off the `tool.execution` that spawned it, and `standalone` requests (title
    # generation) off nothing at all. SpanId breaks Timestamp ties so the view
    # answers the same way twice. [LAW:no-ambient-temporal-coupling]
    #
    # That third population is why the key falls back to SpanId. An empty
    # ParentSpanId is not a parent they share, it is the absence of one, so
    # partitioning on it directly would file every parentless request in a
    # session under one window and let lagInFrame pair two requests that have
    # nothing to do with each other. Falling back to the row's own SpanId makes
    # each of them a partition of one: lagInFrame finds no predecessor,
    # CarriesToolResult is false and ToolResultTokens is 0, by construction
    # rather than by a filter every query would have to remember.
    # [LAW:types-are-the-program]
    #
    # DOLLARS, and the one way to get them wrong. The four token counts bill at
    # rates that differ by a factor of fifty, and the mix is extreme -- 18.4M
    # cache-read tokens against 246 fresh input tokens on one day's sessions --
    # so any single blended rate applied to `TotalTokens` is wrong by a large
    # factor while looking entirely reasonable. Each count is therefore
    # multiplied by its own rate and the four results summed. `CostUSD` is that
    # sum, stated once here so no two queries can disagree about it, and the four
    # components stay visible beside it because "cache reads or output?" is the
    # question that follows "how much?". [LAW:one-source-of-truth]
    #
    # ASOF LEFT JOIN picks the price row in force at the request's own timestamp,
    # which is what makes a future price change leave last month's answer alone.
    # It matches at most one row per request, so the join cannot fan out and the
    # window below still sees exactly one row per request.
    #
    # `toDate(..., 'UTC')` is pinned rather than left to the server. Timestamp is
    # DateTime64(9) with no timezone attached, so a bare toDate() resolves it in
    # whatever zone the host happens to be set to, and the same nanosecond then
    # lands on different calendar days on different machines: the instant
    # 2026-08-23 03:00:00 UTC is 2026-08-23 in UTC and Tokyo, and 2026-08-22 in
    # America/Denver. Either side of an EffectiveFrom boundary, that decides
    # whether a request is priced at all -- so unpinned, one span's cost would
    # depend on the laptop reading it. EffectiveFrom records the date a rate was
    # verified, which is an absolute fact, so the boundary is compared in
    # absolute time. Only the join is pinned: toYYYYMM() in a reader's own query
    # stays local, because a reader asking for "last month" means their own.
    #
    # LEFT, and that is the hazard: an unmatched model does not drop the row, it
    # fills the rates with zeros, and zero dollars is shaped exactly like a
    # request that was free. `Priced` is the discriminator that pulls those two
    # apart -- a real price row always has a non-empty Model, an unmatched one
    # reads '' -- and `ct verify` fails on any request in its probe session that
    # comes back unpriced. Without that column a newly-renamed model would cost
    # nothing, forever, and the monthly total would just quietly shrink.
    # [LAW:parse-dont-validate]
    #
    # Decimal rather than Float64 because this is money, and decimal addition
    # over a year of requests does not drift the way repeated binary-float
    # addition does. The four multiplications below read as plain
    # tokens-times-rate because the per-token rates they use already carry the
    # scale that keeps them exact; the reasoning behind that scale, and the
    # truncation it exists to prevent, is with the prices in model_prices above.
    - query: |
        CREATE OR REPLACE VIEW claude.llm_requests AS
        SELECT
          request.Timestamp AS Timestamp,
          SessionId,
          SpanId,
          ParentSpanId,
          Duration,
          request.Model AS Model,
          RequestContext,
          -- Carried through rather than consumed: it is what EndedInToolCall is
          -- derived from, so keeping it here lets a reader check that derivation
          -- against the row in front of them instead of against this file. Its
          -- other values (end_turn, max_tokens, refusal) are request-level facts
          -- in their own right.
          StopReason,
          AgentId,
          Repository,
          Branch,
          InputTokens,
          OutputTokens,
          CacheReadTokens,
          CacheCreationTokens,
          ContextTokens,

          -- Everything read plus everything written. A token count and not a
          -- cost: cache reads, fresh input and output are billed at different
          -- rates. `CostUSD` below is the money answer; do not multiply this by
          -- a price.
          ContextTokens + OutputTokens AS TotalTokens,

          -- Whether a rate was found at all. False means this model is missing
          -- from claude.model_prices and the four figures below are zeros that
          -- mean "unknown", not "free".
          CAST(price.Model != '' AS Bool) AS Priced,

          toDecimal64(InputTokens, 0)         * price.InputUSDPerToken         AS InputCostUSD,
          toDecimal64(CacheReadTokens, 0)     * price.CacheReadUSDPerToken     AS CacheReadCostUSD,
          toDecimal64(CacheCreationTokens, 0) * price.CacheCreationUSDPerToken AS CacheCreationCostUSD,
          toDecimal64(OutputTokens, 0)        * price.OutputUSDPerToken        AS OutputCostUSD,
          InputCostUSD + CacheReadCostUSD
            + CacheCreationCostUSD + OutputCostUSD AS CostUSD,

          -- CAST to Bool because comparing a LowCardinality(String) yields a
          -- LowCardinality(UInt8), which ClickHouse refuses to store as a column.
          -- The wrapper is an artifact of how StopReason is encoded, never of
          -- what these three mean, so it is dropped where it appears.
          CAST(StopReason = 'tool_use' AS Bool) AS EndedInToolCall,
          CAST(lagInFrame(StopReason) OVER w = 'tool_use' AS Bool) AS CarriesToolResult,
          CAST(EndedInToolCall
               OR CarriesToolResult
               OR RequestContext = 'tool' AS Bool) AS ServesToolCall,

          if(CarriesToolResult,
             ContextTokens - lagInFrame(ContextTokens) OVER w
                           - lagInFrame(OutputTokens) OVER w,
             0) AS ToolResultTokens
        FROM claude.spans AS request
        ASOF LEFT JOIN claude.model_prices AS price
          ON request.Model = price.Model
         AND price.EffectiveFrom <= toDate(request.Timestamp, 'UTC')
        WHERE SpanType = 'llm_request'
        WINDOW w AS (PARTITION BY SessionId, if(ParentSpanId = '', SpanId, ParentSpanId)
                     ORDER BY Timestamp, SpanId
                     ROWS BETWEEN 1 PRECEDING AND CURRENT ROW)

    # The one thing that cannot be a column: attributing a subagent's tokens to
    # the KIND of subagent, because agent_id and subagent_type land on different
    # spans. The link is the span tree -- an llm_request hangs under the
    # tool.execution of the Agent tool call that spawned it -- so it is a two-hop
    # walk, and a walk stated once here rather than re-derived by every question
    # that needs it. Re-derived, it would eventually be got wrong by one hop and
    # return a number that looks entirely reasonable. [LAW:one-source-of-truth]
    #
    # A plain view, so it costs no storage and cannot fall behind the table.
    #
    # OR REPLACE, unlike the table above, and the asymmetry is the point: a view
    # holds no data, so restating it on every start costs nothing and keeps this
    # file authoritative over what the server actually has. Under IF NOT EXISTS an
    # edited definition would apply on a fresh checkout and be silently ignored on
    # every machine that already ran once -- two definitions of one fact, and no
    # way to tell which one answered your query. [LAW:one-source-of-truth]
    #
    # It walks up from claude.llm_requests rather than from the raw span table,
    # and that is what keeps dollars a single definition. This view needs the same
    # per-request cost the view above computes; reaching for `claude.spans` here
    # would mean joining the price table a second time and writing the four
    # multiplications out again, two copies to keep in step forever. Selecting the
    # priced view instead means the money arithmetic exists in exactly one place
    # and a subagent's cost is whatever its requests already cost.
    # [LAW:one-source-of-truth]
    #
    # It is not cheaper to run, and the columns it selects are the whole of what
    # it offers. A plain view is expanded at query time rather than materialised,
    # so this reads claude.spans three times exactly as the direct join did --
    # once inside llm_requests, once per hop -- with the ASOF join added on top.
    # The reason to select from the view is that the arithmetic is written once,
    # which is a correctness argument and does not need a performance one.
    # `ServesToolCall` is deliberately not carried through: it is true for every
    # row here by construction, since `RequestContext = 'tool'` is one of its
    # three clauses and this view filters on precisely that, so exposing it would
    # be a column that answers the same way forever.
    #
    # Ordering here is load-bearing, which is why this block sits last: a view is
    # validated against its sources when it is created, so llm_requests must
    # already exist when this runs, and llm_requests in turn needs model_prices.
    # On a fresh machine these three run in file order, and a reordering that
    # breaks the chain fails loudly at startup under throw_on_error rather than
    # leaving a half-built schema. [LAW:no-ambient-temporal-coupling]
    - query: |
        CREATE OR REPLACE VIEW claude.subagent_requests AS
        SELECT
          request.Timestamp             AS Timestamp,
          request.SessionId             AS SessionId,
          request.AgentId               AS AgentId,
          agent_tool.SubagentType       AS SubagentType,
          request.Model                 AS Model,
          request.InputTokens           AS InputTokens,
          request.OutputTokens          AS OutputTokens,
          request.CacheReadTokens       AS CacheReadTokens,
          request.CacheCreationTokens   AS CacheCreationTokens,
          request.ContextTokens         AS ContextTokens,
          request.TotalTokens           AS TotalTokens,
          request.Priced                AS Priced,
          request.InputCostUSD          AS InputCostUSD,
          request.CacheReadCostUSD      AS CacheReadCostUSD,
          request.CacheCreationCostUSD  AS CacheCreationCostUSD,
          request.OutputCostUSD         AS OutputCostUSD,
          request.CostUSD               AS CostUSD,
          request.Repository            AS Repository,
          request.Branch                AS Branch
        FROM claude.llm_requests AS request
        JOIN claude.spans AS execution  ON request.ParentSpanId   = execution.SpanId
        JOIN claude.spans AS agent_tool ON execution.ParentSpanId = agent_tool.SpanId
        WHERE request.RequestContext = 'tool'

    # --- tickets ------------------------------------------------------------
    # The border between this stack and lit. Everything above answers from spans
    # alone; the three questions about *work* -- how many turns a ticket took,
    # what it cost, which model drove it -- need one fact no span carries, and
    # cannot carry: whether the ticket was finished. A span is stamped when a
    # session starts and is immutable thereafter, so nothing it holds could ever
    # know about a close that happens hours later in a different session.
    #
    # That fact lives in lit, and so does the join key. lit records the actor of
    # every transition as `claude_<session id>` -- the same id Claude Code stamps
    # on its own telemetry -- so the two sides already share a key. No ticket
    # attribute is stamped on any span, and none should be: it would be a second
    # answer to a question lit answers exactly, written at the one moment the
    # answer is least known. [LAW:one-source-of-truth]
    #
    # `executable` runs the script per query rather than importing lit's history
    # into a table here. An imported copy would need a refresh command, and the
    # failure mode of a refresh command is a store that answers a stale question
    # with a straight face. Measured, it costs about 0.14s once lit's Dolt store
    # is warm and several seconds on the first call of the day, paid by ticket
    # queries only -- a correctness argument that does not need a performance
    # one, the same trade claude.subagent_requests makes above.
    #
    # THE BORDER IS LOUD, AND HAD TO BE MADE SO. `executable` reports a command
    # that exits non-zero, or does not exist at all, as zero rows -- so a missing
    # lit and an empty backlog arrive as the same value, and "average turns per
    # ticket" over nothing is exactly the confident, wrong, unfalsifiable number
    # this epic exists to prevent. [LAW:no-silent-failure]
    #
    # Two things make the guards below actually run, and both were arrived at by
    # watching an earlier version fail to.
    #
    # The aggregate is what gives them anything to fire on: over zero rows,
    # count() still yields one row, where a bare filter would have none.
    #
    # And each guard is folded into `Document` -- the value the ARRAY JOIN reads
    # -- rather than sitting in a column of its own, because a column nothing
    # selects is pruned before it is ever evaluated. Written the obvious way, as
    # its own named column, the check passed a broken lit straight through:
    # `SELECT count()` never asked for the guard, so the guard never ran.
    # substring(x, 1 + throwIf(...)) is x on the happy path and cannot be
    # optimised away, because Document genuinely depends on it.
    #
    # Nesting them is what keeps the two diagnoses apart: the presence guard is
    # computed first because the version guard reads its output, so an unreadable
    # lit is reported as an unreadable lit and never as a schema change. That
    # ordering is a data dependency rather than a hope about evaluation order.
    # [LAW:parse-dont-validate]
    - query: |
        CREATE OR REPLACE VIEW claude.ticket_events AS
        SELECT
          JSONExtractString(event, 'issue_id') AS Ticket,
          JSONExtractString(event, 'actor')    AS Actor,
          -- Empty for lit's own automated actors, which is the truth: no session
          -- ran them, so they name a transition but never any turns.
          if(startsWith(Actor, 'claude_'),
             substring(Actor, length('claude_') + 1), '') AS SessionId,
          -- RFC3339 with a Z, so the zone is in the value rather than inherited
          -- from the host. Pinned to UTC here so the comparison against span
          -- timestamps is between two instants and not two local readings.
          --
          -- The throwing parse, not the OrNull one. lit's timestamps are machine
          -- written, so one that will not parse is a defect rather than a value
          -- that is legitimately absent -- and OrNull would turn it into a NULL
          -- that every aggregate below silently skips, moving a ticket's window
          -- with nothing to show for it. [LAW:no-silent-failure]
          parseDateTime64BestEffort(
            JSONExtractString(event, 'created_at'), 9, 'UTC') AS At,
          JSONExtractString(event, 'action')   AS Action,
          -- The status transition, taken from the event's `changes` rather than
          -- from `action`: action is a label lit is free to rename and 2 of the
          -- 45 events on file carry none at all, while a change of the `status`
          -- field is the state transition itself. Empty when this event changed
          -- no status -- a comment, a re-parenting, an edited description --
          -- which still leaves the row, because its actor is a session that
          -- touched this ticket and participation is what the join needs.
          JSONExtractString(
            arrayFirst(change -> JSONExtractString(change, 'field') = 'status',
                       JSONExtractArrayRaw(event, 'changes')),
            'to') AS ToStatus
        FROM (
          SELECT
            substring(Present,
                      1 + throwIf(JSONExtractInt(Present, 'version') != 2,
                                  'lit export is not schema version 2 -- claude.ticket_events reads a shape lit no longer writes. Compare `lit export` against the JSONExtract calls in config/clickhouse.yaml.')) AS Document
          FROM (
            SELECT
              substring(any(json),
                        1 + throwIf(count() = 0,
                                    'lit produced no export, so claude.ticket_events cannot tell an empty backlog from an unreadable one and refuses to answer. Check that lit is on PATH for the ClickHouse process and that the workspace named in the generated user_scripts/lit_export.sh still exists.')) AS Present
            FROM executable('lit_export.sh', 'JSONAsString', 'json String')
            -- lit opens a Dolt database to answer, which takes seconds rather
            -- than milliseconds. ClickHouse's default patience is 10s and a
            -- backlog only grows, so the wait is stated rather than left to a
            -- default that a larger backlog would silently start tripping.
            --
            -- 60000ms is CT_LIT_TIMEOUT_SECONDS in lib/common.sh, in the other
            -- unit, and the two have to move together. ClickHouse substitutes
            -- whole values and never substrings of a query, so @from_env cannot
            -- reach inside this SQL string and a comment is the only join
            -- available -- the same duplication lit_export.sh's filename
            -- carries, documented the same way. Raise this without raising that
            -- one and `ct` hangs up on a query ClickHouse is still lawfully
            -- working on, then blames the timeout on causes it is not; lower it
            -- without lowering that one and the probe outlives the query it is
            -- meant to predict. [LAW:one-source-of-truth]
            SETTINGS command_read_timeout = 60000
          )
        )
        ARRAY JOIN JSONExtractArrayRaw(Document, 'events') AS event

    # One row per turn: the grain the epic's turn questions are asked at, and the
    # only place a turn is defined. It holds no ticket -- a turn is a fact about
    # a session -- so it also answers "where did this session's tokens go" on its
    # own, and claude.ticket_turns below is this view plus an attribution.
    #
    # A turn is an interaction span, and its requests are the llm_requests of the
    # same session that fall inside it. They have to be found by time: only
    # interaction spans carry interaction.sequence -- measured, on every span in
    # this store -- so an llm_request does not know its own turn number and the
    # span it belongs to is the one whose window contains it.
    #
    # WHAT THIS VIEW DOES NOT COVER, since the omission is silent and costs
    # money. A request that belongs to no interaction span falls inside no turn
    # and so appears in no row here -- llm_requests carries a third population,
    # RequestContext = 'standalone' (title generation and the like), which hangs
    # off no parent. On the store this was written against that is 2 requests and
    # $0.25 against a $88.27 total, so summing CostUSD here under-reports a
    # session by exactly that much. claude.llm_requests is the authority for a
    # session total; this view is the authority for a turn.
    #
    # A synthetic Turn = 0 bucket would make the two reconcile, and is
    # deliberately not here: the grain of this view is a turn, and a row claiming
    # to be a turn while not being one trades a documented gap for a misleading
    # value. [LAW:one-type-per-behavior]
    #
    # NEVER JOIN THESE BY TRACE ID. A `claude` launched from inside another
    # session's Bash tool call parents its root span to the caller's, so one
    # trace here holds more than one session -- traces of five are on file, and
    # the nesting goes as deep as the sessions do. `ct verify` adds a session to
    # whatever trace is already open around it, which makes this shape routine
    # whenever verify is run from inside a Claude Code session, as it is during
    # this repo's own development; run from a plain shell it is one session like
    # any other. SessionId is the key; TraceId is not.
    #
    # The turn definition is a CTE because it is needed twice -- once as the list
    # of turns, once to place each request in one -- and a definition spelled out
    # twice is two definitions that will eventually disagree about where a turn
    # ends. [LAW:one-source-of-truth]
    #
    # The LEFT JOIN is load-bearing. Every session on file ends with one or more
    # sub-second turns that invoked no model at all -- a slash command handled
    # locally, an interrupted line -- and an inner join would drop them, making
    # the join type silently decide what counts as a turn. They are kept, counted
    # and marked: InvokedModel is the discriminator, so the choice is made by a
    # named column that a reader can see and audit rather than by a join.
    # [LAW:dataflow-not-control-flow]
    #
    # Model is the model that produced the most main-loop output in the turn, not
    # the model of any one request. A turn runs subagents on other models and
    # picks up background haiku calls, so "which model drove this turn" is a
    # question about the weight of the work, and RequestContext = 'interaction'
    # is what separates the main loop from the subagents running under it.
    - query: |
        CREATE OR REPLACE VIEW claude.session_turns AS
        WITH turn AS (
          SELECT
            SessionId,
            Turn,
            min(Began) AS Began,
            max(Ended) AS Ended
          FROM (
            SELECT
              SessionId,
              InteractionSequence AS Turn,
              toDateTime64(Timestamp, 9, 'UTC') AS Began,
              Began + toIntervalNanosecond(Duration) AS Ended
            FROM claude.spans
            WHERE SpanType = 'interaction'
          )
          -- One row per turn, guaranteed here rather than assumed. claude.spans
          -- is a plain MergeTree with no dedup key and the collector retries
          -- failed exports, so the same interaction span can arrive twice; the
          -- store holds no such duplicate today, but nothing prevents one. A
          -- duplicate would fan this CTE out against the per-turn aggregate it
          -- joins, doubling that turn's requests, tokens and cost with no error
          -- and no missing row. (SessionId, Turn) is unique for well-formed
          -- data, so collapsing is the correct reading, not a lossy one.
          GROUP BY SessionId, Turn
        )
        SELECT
          turn.SessionId       AS SessionId,
          turn.Turn            AS Turn,
          turn.Began           AS Began,
          turn.Ended           AS Ended,
          worked.Model         AS Model,
          worked.Requests      AS Requests,
          worked.OutputTokens  AS OutputTokens,
          worked.TotalTokens   AS TotalTokens,
          -- Never multiply TotalTokens by a rate: the four counts bill at rates
          -- spanning 50x. This is the sum of what each request already cost.
          worked.CostUSD       AS CostUSD,
          -- Requests > 0 is not redundant with Unpriced = 0, it is what stops
          -- this column lying. An unmatched LEFT JOIN fills Unpriced with 0
          -- rather than NULL, so "every request found a rate" would read true
          -- for a turn with no requests at all -- zero dollars shaped like free,
          -- the exact trap claude.llm_requests.Priced exists to prevent, one
          -- grain up. Priced now means what its sibling means, and InvokedModel
          -- below is where "there was nothing to price" is said.
          worked.Requests > 0 AND worked.Unpriced = 0 AS Priced,
          worked.Requests > 0  AS InvokedModel
        FROM turn
        LEFT JOIN (
          SELECT
            SessionId,
            Turn,
            argMax(Model, MainLoopOutputTokens) AS Model,
            sum(Requests)     AS Requests,
            sum(OutputTokens) AS OutputTokens,
            sum(TotalTokens)  AS TotalTokens,
            sum(CostUSD)      AS CostUSD,
            sum(Unpriced)     AS Unpriced
          FROM (
            SELECT
              turn.SessionId AS SessionId,
              turn.Turn      AS Turn,
              request.Model  AS Model,
              sumIf(request.OutputTokens,
                    request.RequestContext = 'interaction') AS MainLoopOutputTokens,
              count()                     AS Requests,
              sum(request.OutputTokens)   AS OutputTokens,
              sum(request.TotalTokens)    AS TotalTokens,
              sum(request.CostUSD)        AS CostUSD,
              countIf(NOT request.Priced) AS Unpriced
            FROM turn
            INNER JOIN claude.llm_requests AS request
              ON request.SessionId = turn.SessionId
            WHERE toDateTime64(request.Timestamp, 9, 'UTC')
                  BETWEEN turn.Began AND turn.Ended
            GROUP BY SessionId, Turn, Model
          )
          GROUP BY SessionId, Turn
        ) AS worked
          ON worked.SessionId = turn.SessionId AND worked.Turn = turn.Turn

    # The join this ticket exists for: one row per turn attributed to a ticket.
    #
    # WHAT "TURNS TO COMPLETE A TICKET" MEANS HERE, because the number is
    # confidently wrong under any of the obvious alternatives:
    #
    #   A ticket's work window runs from the first transition into in_progress to
    #   the last into closed, or to now() while it is still open. A ticket is
    #   rarely one session -- zbi.5 was started by one and closed by another two
    #   days later -- so the window, not the session, is the unit.
    #
    #   Its sessions are the ones lit records MOVING it -- claiming, closing,
    #   reopening -- rather than every session that touched it. That is a floor
    #   and not a census: a session that worked a ticket and never transitioned
    #   it leaves no trace here and cannot be counted. The looser reading costs
    #   more than it buys, and the reason is in the participant join below.
    #
    #   A turn counts when its interval OVERLAPS the window -- not when its
    #   timestamp falls inside it. Turns here are long: one turn ran 3.6 hours
    #   and did the whole of zbi.4, beginning two minutes BEFORE the `lit start`
    #   that claimed the ticket. Point containment on the start timestamp scores
    #   that ticket zero turns, which is the wrong answer arrived at tidily.
    #
    #   Turns that invoked no model are excluded, by the discriminator
    #   session_turns names rather than by a join quietly dropping them.
    #
    # ONE READ OF LIT, and it has to be exactly one. claude.ticket_events is a
    # plain view over an external process, so ClickHouse re-runs `lit export` for
    # every textual reference to it -- measured, and a CTE does not help, because
    # CTEs here are inlined rather than materialised. Two reads of a live store
    # can disagree, and a transition landing between them would leave the two
    # halves of this join holding different backlogs, silently dropping the turns
    # of whichever ticket they disagreed about.
    #
    # A scalar subquery is the one thing ClickHouse does evaluate once, so the
    # whole event log is frozen into `Moves` up front and everything below reads
    # that constant. Measured at one invocation per query, against three for the
    # obvious CTE version. It also keeps the plan flat: an earlier attempt to get
    # to one read with nested window functions was rejected by ClickHouse itself
    # with TOO_MANY_QUERY_PLAN_OPTIMIZATIONS. [LAW:one-source-of-truth]
    #
    # WorkedUntil is a value, not a branch: a ticket that is still open has been
    # worked up to now, so the window's upper bound is now() rather than a
    # missing endpoint the join would have to special-case. Completed is carried
    # so that "turns to COMPLETE a ticket" can exclude the open ones -- averaging
    # over a ticket still being worked measures how far it has got, not what it
    # took. [LAW:dataflow-not-control-flow]
    #
    # WHAT IS STILL NOT SEPARABLE, stated rather than left to be discovered,
    # worst first. A session that claims a ticket, never closes it, and never
    # touches another ticket keeps accruing to it -- neither store holds
    # anything that could bound that case, and it needs only ONE stale ticket.
    # Two tickets genuinely worked in the same turn share it, because nothing
    # records which of them the turn was for. A session that worked a ticket and
    # never transitioned it leaves no trace and cannot be counted at all.
    #
    # And one that runs the OTHER way, kept last because it is the one a reader
    # will not be expecting: the participant floor is Started, shared by every
    # session, so a session that engages late contributes turns from before it
    # arrived. That overcounts, where the three above undercount or report
    # absence. Argued where it is implemented, at the participant join below.
    # This list and the README's must agree; they are the same list.
    - query: |
        CREATE OR REPLACE VIEW claude.ticket_turns AS
        WITH
          (SELECT groupArray((Ticket, SessionId, At, ToStatus))
           FROM claude.ticket_events
           WHERE ToStatus != '') AS Moves
        SELECT
          life.Ticket       AS Ticket,
          life.Started      AS Started,
          -- NULL rather than the DateTime64 zero a never-closed ticket's maxIf
          -- returns. 1970-01-01 is answer-shaped: it reads as a close date, and
          -- a query that forgets `WHERE Completed` gets one instead of nothing.
          -- The raw value is still what WorkedUntil consumes below -- one place
          -- computes it, this decides how it is shown. [LAW:parse-dont-validate]
          if(life.Completed, life.Closed, NULL) AS Closed,
          life.Completed    AS Completed,
          turn.SessionId    AS SessionId,
          turn.Turn         AS Turn,
          turn.Began        AS Began,
          turn.Ended        AS Ended,
          turn.Model        AS Model,
          turn.Requests     AS Requests,
          turn.OutputTokens AS OutputTokens,
          turn.TotalTokens  AS TotalTokens,
          turn.CostUSD      AS CostUSD,
          turn.Priced       AS Priced
        FROM (
          SELECT
            move.1 AS Ticket,
            -- The first claim ever, so a ticket abandoned and resumed reports
            -- the total effort it took rather than only the last attempt.
            minIf(move.3, move.4 = 'in_progress') AS Started,
            maxIf(move.3, move.4 = 'closed')      AS Closed,
            -- Completed asks what the ticket's status IS, not whether it was
            -- ever closed. The difference is a reopened ticket: "has a close
            -- ever happened" stays true forever, so it would be reported as
            -- finished by every `WHERE Completed` query, and WorkedUntil would
            -- pin to the stale close -- silently dropping every turn worked
            -- after the reopen. Reading the last transition instead makes a
            -- reopened ticket open again, which puts its window back on now()
            -- and picks those turns up. [LAW:no-silent-failure]
            argMax(move.4, move.3) = 'closed'      AS Completed,
            if(Completed, Closed, now64(9, 'UTC')) AS WorkedUntil
          FROM (SELECT arrayJoin(Moves) AS move)
          GROUP BY Ticket
          -- A ticket nobody ever claimed has no window and so no turns. Absent
          -- rather than zero: zero turns is an answer, and this is the absence
          -- of one. [LAW:parse-dont-validate]
          HAVING countIf(move.4 = 'in_progress') > 0
        ) AS life
        INNER JOIN (
          -- A session counts as working a ticket when it MOVED the ticket --
          -- claimed it, closed it, reopened it -- and not merely when it touched
          -- it. The distinction is load-bearing rather than fastidious: a
          -- grooming pass edits the description and rank of dozens of tickets in
          -- one sitting, and on the looser reading it becomes a participant in
          -- every one of them, donating its turns to whichever windows happened
          -- to be open at the time. ToStatus is empty for exactly those
          -- annotating events, and Moves is filtered on it above.
          --
          -- SwitchedAway is the moment this session moved on, and the whole of
          -- it rests on EngagedUntil being the session's LAST move on this
          -- ticket rather than its first. Anchored on the first, "its next move
          -- elsewhere" means its next move after it ARRIVED, when what is
          -- wanted is its next move after it LEFT -- so a session that claims
          -- this ticket, steps away to another, then comes back and finishes it
          -- caps at the excursion and loses everything after the return, while
          -- WorkedUntil correctly runs to the close. Same shape for a reopen:
          -- the session's own second visit falls past its own first departure.
          -- Both are the silent drop the Completed/argMax reading above exists
          -- to prevent, and both are answered by which end of the engagement
          -- the anchor sits on. [LAW:no-silent-failure]
          --
          -- Anchoring on the last move is also why nothing here has to exclude
          -- moves on this same ticket: every one of them is at or before the
          -- session's last move on it, so `later.3 > EngagedUntil` has already
          -- dropped them. An explicit `later.1 != Ticket` was tried and removed
          -- as dead weight -- it re-states in a filter what the anchor already
          -- guarantees, and a second enforcer of an invariant is a second thing
          -- that can come to disagree with it. [LAW:single-enforcer]
          --
          -- Without the cap at all, one ticket left in_progress and forgotten
          -- has a window running to now() forever, quietly collecting that
          -- session's entire
          -- subsequent history -- months of unrelated turns and cost filed under
          -- a ticket nobody ever finished. That needs only ONE stale ticket,
          -- where the shared-turn caveat above needs two live ones.
          --
          -- It cannot be a LOWER bound keyed on the session's first event here,
          -- which is the obvious reading: zbi.5's closing session has exactly
          -- one event on that ticket, the `done` at the very end, and all its
          -- real work precedes it. The ticket's own window stays the primary
          -- bound; this is a cap laid on top of it.
          --
          -- The price of that, stated because it runs the OTHER way from every
          -- caveat below: the floor is life.Started, shared by all participants,
          -- so a session that only engages this ticket late -- one reopen near
          -- the end, say -- contributes its turns from the ticket's own
          -- beginning, including turns it spent on work that had nothing to do
          -- with this ticket. That overcounts. Every other known failure here
          -- undercounts or reports absence, so this is the one number that can
          -- be confidently too big rather than conservatively too small.
          --
          -- The sentinel is an identity, not a special case: a session that
          -- never moved again contributes +infinity, so `least` below decides
          -- the bound with no branch to read.
          -- [LAW:dataflow-not-control-flow]
          SELECT
            Ticket,
            SessionId,
            arrayReduce('min', arrayConcat(
              [toDateTime64('2262-01-01 00:00:00', 9, 'UTC')],
              arrayMap(later -> later.3,
                       arrayFilter(later -> later.2 = SessionId
                                            AND later.3 > EngagedUntil,
                                   Moves)))) AS SwitchedAway
          FROM (
            SELECT move.1 AS Ticket, move.2 AS SessionId, max(move.3) AS EngagedUntil
            FROM (SELECT arrayJoin(Moves) AS move)
            WHERE move.2 != ''
            GROUP BY Ticket, SessionId
          )
        ) AS participant ON participant.Ticket = life.Ticket
        INNER JOIN claude.session_turns AS turn
          ON turn.SessionId = participant.SessionId
        WHERE turn.InvokedModel
          AND turn.Began <= least(life.WorkedUntil, participant.SwitchedAway)
          AND turn.Ended >= life.Started
